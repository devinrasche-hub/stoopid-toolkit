name: Deploy Credits API

# Deploys credits-api/ (Cloudflare Worker + D1 database) — THE CREDITS DEPARTMENT backend.
# Uses the same CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID repo secrets as Ask Dev.
# Also needs CREDITS_ADMIN_TOKEN (32+ random characters) for the admin. Optional: IP_SALT, and
# CREDITS_GOOGLE_CLIENT_ID + CREDITS_GOOGLE_CLIENT_SECRET to switch on "Verify with YouTube".
# Migrations are forward-only and additive; rollback SQL is in credits-api/rollback/.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "credits-api/**"
      - "credits/engine/**"
      - ".github/workflows/deploy-credits-api.yml"

permissions:
  contents: read

concurrency:
  group: credits-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: credits-api
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare secrets
        id: gate
        working-directory: .
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Credits API NOT deployed: add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository secrets. See docs/credits-deployment.md."
            echo "ok=false" >> "$GITHUB_OUTPUT"
            [ "${{ github.event_name }}" = "workflow_dispatch" ] && exit 1
            exit 0
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - if: steps.gate.outputs.ok == 'true'
        uses: actions/checkout@v5

      - if: steps.gate.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - if: steps.gate.outputs.ok == 'true'
        run: npm ci

      - if: steps.gate.outputs.ok == 'true'
        name: Test before deploying
        run: npm test

      - if: steps.gate.outputs.ok == 'true'
        name: Find or create the D1 database
        run: |
          DB_ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="stoopid_credits") | .uuid')
          if [ -z "$DB_ID" ]; then
            npx wrangler d1 create stoopid_credits
            DB_ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="stoopid_credits") | .uuid')
          fi
          [ -n "$DB_ID" ] || { echo "::error::Could not find or create the stoopid_credits database."; exit 1; }
          sed -i "s/^database_id = .*/database_id = \"$DB_ID\"/" wrangler.toml
          echo "Using D1 database $DB_ID"

      - if: steps.gate.outputs.ok == 'true'
        name: Apply migrations (only new ones run)
        run: npx wrangler d1 migrations apply stoopid_credits --remote

      - if: steps.gate.outputs.ok == 'true'
        name: Deploy worker
        run: npx wrangler deploy

      - if: steps.gate.outputs.ok == 'true'
        name: Sync secrets
        env:
          ADMIN_TOKEN: ${{ secrets.CREDITS_ADMIN_TOKEN }}
          IP_SALT: ${{ secrets.IP_SALT }}
          GOOGLE_CLIENT_ID: ${{ secrets.CREDITS_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.CREDITS_GOOGLE_CLIENT_SECRET }}
        run: |
          for name in ADMIN_TOKEN IP_SALT GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET; do
            value="${!name}"
            if [ -n "$value" ]; then printf '%s' "$value" | npx wrangler secret put "$name" >/dev/null; echo "set $name"; fi
          done
          if [ ${#ADMIN_TOKEN} -lt 32 ]; then
            echo "::warning::CREDITS_ADMIN_TOKEN is missing or shorter than 32 characters. The public pages work; the admin stays locked (HTTP 503) until it is set."
          fi

      - if: steps.gate.outputs.ok == 'true'
        name: Smoke test (reads only)
        run: |
          base=https://stoopid-credits.stoopidshow.workers.dev
          # Each `wrangler secret put` above rolls out a new Worker version, so the first requests
          # can briefly hit one mid-rollout and get a 5xx. Retry 5xx/no-answer for up to ~60 s.
          probe() {
            for i in $(seq 1 12); do
              code=$(curl -s -o /dev/null --max-time 10 -w '%{http_code}' "$1")
              case "$code" in 5*|000) sleep 5 ;; *) break ;; esac
            done
            echo "$code"
          }
          code=$(probe $base/public/health)
          echo "GET /public/health -> $code (expected 200)"
          [ "$code" = "200" ] || { echo "::error::Worker isn't answering at $base (HTTP $code)."; exit 1; }
          code=$(probe $base/admin/overview)
          echo "GET /admin/overview without a token -> $code (expected 401 or 503)"
          case "$code" in
            401|503) ;;
            2*|3*) echo "::error::Admin answered without a token!"; exit 1 ;;
            *) echo "::error::Admin returned HTTP $code instead of refusing (401). Check the Worker logs."; exit 1 ;;
          esac

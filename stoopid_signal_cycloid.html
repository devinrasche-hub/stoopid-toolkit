<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STOOPID SIGNAL — Brachistochrone</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Share+Tech+Mono&display=swap');
  html,body{margin:0;height:100%;background:#000;overflow:hidden;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;}
  canvas{display:block;height:100vh;width:auto;max-width:100vw;background:#000;}
  #warm{position:absolute;left:-9999px;top:-9999px;}
  #warm .b{font-family:'Bebas Neue';} #warm .m{font-family:'Share Tech Mono';}
</style>
</head>
<body>
<style>.vault-return{position:fixed;left:56px;bottom:0;z-index:999;font-family:'Courier New',monospace;font-size:10px;letter-spacing:2px;color:#00FFC6;background:#000;border:1px solid #00FFC6;border-bottom:none;padding:5px 13px;text-decoration:none;opacity:.55;transition:opacity .15s}.vault-return:hover{opacity:1;background:#00FFC6;color:#000}@media(max-width:700px){.vault-return{left:14px}}</style>
<a class="vault-return" href="index.html">&#9666; THE VAULT</a>
<div id="wrap"><canvas id="c" width="1080" height="1920"></canvas></div>
<div id="warm"><span class="b">BEBAS</span><span class="m">MONO</span></div>
<script>
const BLACK='#000000', WHITE='#FFFFFF';
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const A=[190,560], B=[900,1200];                 // start (top-left) → end (lower-right)
const g=980;                                     // px/s^2
const dx=B[0]-A[0], dy=B[1]-A[1];

// ---- build the three tracks as arc-length-parametrised polylines ----
function track(pts){
  const cum=[0], slope=[];
  for(let i=1;i<pts.length;i++){
    const L=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);
    cum.push(cum[i-1]+L); slope.push((pts[i][1]-pts[i-1][1])/L);   // downward slope of segment
  }
  return {pts, cum, slope, len:cum[cum.length-1]};
}
function segAt(tr,s){ if(s<=0) return 0; if(s>=tr.len) return tr.slope.length-1;
  let lo=0,hi=tr.cum.length-1; while(hi-lo>1){const m=(lo+hi)>>1; if(tr.cum[m]<s) lo=m; else hi=m;} return lo; }
function sample(tr,s){                            // point at arc length s
  const {pts,cum}=tr; if(s<=0) return pts[0]; if(s>=tr.len) return pts[pts.length-1];
  let lo=0,hi=cum.length-1; while(hi-lo>1){const m=(lo+hi)>>1; if(cum[m]<s) lo=m; else hi=m;}
  const f=(s-cum[lo])/(cum[hi]-cum[lo]);
  return [pts[lo][0]+(pts[hi][0]-pts[lo][0])*f, pts[lo][1]+(pts[hi][1]-pts[lo][1])*f];
}
// LINE
const line=track(Array.from({length:200},(_,i)=>{const f=i/199;return [A[0]+dx*f, A[1]+dy*f];}));
// CIRCLE arc, tangent to vertical at A (fair start), bulging down to B
const rC=(dx*dx+dy*dy)/(2*dx), cc=[A[0]+rC, A[1]];
const angA=Math.PI, angB=Math.atan2(B[1]-cc[1], B[0]-cc[0]);
const circle=track(Array.from({length:240},(_,i)=>{const a=angA+(angB-angA)*i/239;return [cc[0]+rC*Math.cos(a), cc[1]+rC*Math.sin(a)];}));
// CYCLOID (brachistochrone): cusp at A, solve phi_end so endpoint hits B
function fphi(p){return (p-Math.sin(p))/(1-Math.cos(p)) - dx/dy;}
let pe=2.0; for(let k=0;k<60;k++){const h=1e-6; const d=(fphi(pe+h)-fphi(pe-h))/(2*h); pe-=fphi(pe)/d;}
const aC=dy/(1-Math.cos(pe));
const cyc=track(Array.from({length:260},(_,i)=>{const p=pe*i/259;return [A[0]+aC*(p-Math.sin(p)), A[1]+aC*(1-Math.cos(p))];}));

const TRACKS=[
  {name:'STRAIGHT', tr:line,   col:[0,255,198]},
  {name:'ARC',      tr:circle, col:[138,43,226]},
  {name:'CYCLOID',  tr:cyc,    col:[204,85,0]},
];
let beads=[];
function reset(){ beads=TRACKS.map(()=>({s:0, v:0, done:false, tfin:0})); }

const INTRO=0.9, RACE=4.5, HOLD=3.6, TOTAL=INTRO+RACE+HOLD;
let startT=null, paused=false, pauseAt=0, lastT=0;

function setLS(px){ if('letterSpacing' in ctx) ctx.letterSpacing=px+'px'; }
function watermark(){ ctx.save(); ctx.font="30px 'Share Tech Mono', monospace";
  ctx.fillStyle="rgba(255,255,255,0.40)"; ctx.textAlign="center"; setLS(2);
  ctx.fillText("@stoopidshow", CX(), 70); setLS(0); ctx.restore(); }
function CX(){return 540;}
function credit(){ ctx.save(); ctx.font="24px 'Share Tech Mono', monospace";
  ctx.fillStyle="rgba(0,255,198,0.55)"; ctx.textAlign="left"; setLS(1);
  ctx.fillText("BRACHISTOCHRONE // SAME START, SAME FINISH", 40, 1876); setLS(0); ctx.restore(); }
function nameCard(txt){ ctx.save(); ctx.font="112px 'Bebas Neue', sans-serif";
  ctx.fillStyle=WHITE; ctx.textAlign="center"; setLS(12);
  ctx.fillText(txt, 546, 260); setLS(0); ctx.restore(); }
function payoff(){ ctx.save(); ctx.font="98px 'Bebas Neue', sans-serif";
  ctx.fillStyle=WHITE; ctx.textAlign="center"; ctx.shadowColor="rgb(204,85,0)"; ctx.shadowBlur=18;
  setLS(9); ctx.fillText("THE STRAIGHT LINE LOSES", 545, 1560); setLS(0); ctx.restore(); }

function drawTrack(T){
  const c=T.col; ctx.lineCap="round";
  ctx.beginPath(); ctx.moveTo(T.tr.pts[0][0],T.tr.pts[0][1]);
  for(const p of T.tr.pts) ctx.lineTo(p[0],p[1]);
  ctx.strokeStyle=`rgba(${c[0]},${c[1]},${c[2]},0.16)`; ctx.lineWidth=9; ctx.stroke();
  ctx.strokeStyle=`rgba(${c[0]},${c[1]},${c[2]},0.85)`; ctx.lineWidth=2.4; ctx.stroke();
}

function frame(now){
  if(startT===null){ startT=now; lastT=0; reset(); }
  let t = paused ? pauseAt : (now-startT)/1000;
  if(t>=TOTAL){ startT=now; t=0; lastT=0; reset(); }
  const dt=Math.min(0.05, Math.max(0, t-lastT)); lastT=t;

  // integrate beads during the race window (accel along local slope: a = g·dy/ds)
  if(t>=INTRO && t<INTRO+RACE && !paused){
    const ss=Math.max(1, Math.round(dt/0.002));      // fixed sub-steps for stability
    const h=dt/ss;
    for(let i=0;i<TRACKS.length;i++){ const b=beads[i], tr=TRACKS[i].tr;
      if(b.done) continue;
      for(let k=0;k<ss;k++){
        b.v += g*tr.slope[segAt(tr,b.s)]*h; if(b.v<0) b.v=0;
        b.s += b.v*h;
        if(b.s>=tr.len){ b.s=tr.len; b.done=true; b.tfin=t-INTRO; break; }
      }
    }
  }

  ctx.fillStyle=BLACK; ctx.fillRect(0,0,1080,1920);
  watermark(); credit();
  for(const T of TRACKS) drawTrack(T);

  // A / B markers
  ctx.fillStyle="rgba(255,255,255,0.85)";
  ctx.beginPath(); ctx.arc(A[0],A[1],9,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(B[0],B[1],9,0,Math.PI*2); ctx.fill();
  ctx.font="26px 'Share Tech Mono', monospace"; ctx.textAlign="center";
  ctx.fillStyle="rgba(255,255,255,0.7)"; ctx.fillText("A", A[0], A[1]-24); ctx.fillText("B", B[0], B[1]+40);

  // beads
  for(let i=0;i<TRACKS.length;i++){ const T=TRACKS[i], b=beads[i], c=T.col;
    const p=sample(T.tr,b.s);
    ctx.save(); ctx.shadowColor=`rgb(${c[0]},${c[1]},${c[2]})`; ctx.shadowBlur=b.done?20:12;
    ctx.fillStyle=`rgb(${c[0]},${c[1]},${c[2]})`;
    ctx.beginPath(); ctx.arc(p[0],p[1], b.done?15:12, 0,Math.PI*2); ctx.fill(); ctx.restore();
  }

  // leaderboard (finish order)
  const fin=TRACKS.map((T,i)=>({n:T.name,c:T.col,d:beads[i].done,tf:beads[i].tfin}))
    .filter(x=>x.d).sort((a,b)=>a.tf-b.tf);
  ctx.font="34px 'Share Tech Mono', monospace"; ctx.textAlign="left"; setLS(1);
  for(let i=0;i<fin.length;i++){ const f=fin[i];
    ctx.fillStyle=`rgb(${f.c[0]},${f.c[1]},${f.c[2]})`;
    ctx.fillText(`${i+1}. ${f.n}  ${f.tf.toFixed(2)}s`, 70, 1580+i*46); }
  setLS(0);

  if(t<INTRO+0.6) nameCard("BRACHISTOCHRONE");
  if(t>INTRO+RACE+0.6) payoff();

  requestAnimationFrame(frame);
}
addEventListener('keydown', e=>{
  if(e.code==='Space'){ e.preventDefault();
    if(!paused){ paused=true; pauseAt=(performance.now()-startT)/1000; }
    else { paused=false; startT=performance.now()-pauseAt*1000; } }
  if(e.key==='r'||e.key==='R'){ startT=performance.now(); reset(); paused=false; }
});
function boot(){ requestAnimationFrame(frame); }
if(document.fonts && document.fonts.ready)
  Promise.race([document.fonts.ready, new Promise(r=>setTimeout(r,1500))]).then(boot);
else boot();
</script>
</body>
</html>

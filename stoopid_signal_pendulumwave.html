<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STOOPID SIGNAL — Pendulum Wave</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Share+Tech+Mono&display=swap');
  html,body{margin:0;height:100%;background:#000;overflow:hidden;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;}
  canvas{display:block;height:100vh;width:auto;max-width:100vw;background:#000;}
  #warm{position:absolute;left:-9999px;top:-9999px;}#warm .b{font-family:'Bebas Neue';}#warm .m{font-family:'Share Tech Mono';}
</style>
</head>
<body>
<style>.vault-return{position:fixed;left:56px;bottom:0;z-index:999;font-family:'Courier New',monospace;font-size:10px;letter-spacing:2px;color:#00FFC6;background:#000;border:1px solid #00FFC6;border-bottom:none;padding:5px 13px;text-decoration:none;opacity:.55;transition:opacity .15s}.vault-return:hover{opacity:1;background:#00FFC6;color:#000}@media(max-width:700px){.vault-return{left:14px}}</style>
<a class="vault-return" href="index.html">&#9666; THE VAULT</a>
<div id="wrap"><canvas id="c" width="1080" height="1920"></canvas></div>
<div id="warm"><span class="b">B</span><span class="m">M</span></div>
<script>
const BLACK='#000000',WHITE='#FFFFFF';
const PAL=[[0,255,198],[138,43,226],[204,85,0]];
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const NB=18, TOP=360, GAP=74, AMP=360, PIV=540;
const BASE=20;                                   // oscillations of slowest bob per cycle
const CYCLE=30;                                  // seconds to fully realign
// bob i completes (BASE+i) oscillations in CYCLE seconds
function omega(i){return 2*Math.PI*(BASE+i)/CYCLE;}
function colOf(i){const t=i/(NB-1)*(PAL.length-1),a=Math.floor(t),f=t-a;const c1=PAL[a],c2=PAL[Math.min(a+1,PAL.length-1)];return[c1[0]+(c2[0]-c1[0])*f,c1[1]+(c2[1]-c1[1])*f,c1[2]+(c2[2]-c1[2])*f];}

const tb=document.createElement('canvas');tb.width=1080;tb.height=1920;const tbx=tb.getContext('2d');
const INTRO=0.7,TOTAL=INTRO+CYCLE;
let startT=null,paused=false,pauseAt=0;
function setLS(px){if('letterSpacing' in ctx)ctx.letterSpacing=px+'px';}
function wm(){ctx.save();ctx.font="30px 'Share Tech Mono'";ctx.fillStyle="rgba(255,255,255,0.40)";ctx.textAlign="center";setLS(2);ctx.fillText("@stoopidshow",PIV,70);setLS(0);ctx.restore();}
function credit(){ctx.save();ctx.font="24px 'Share Tech Mono'";ctx.fillStyle="rgba(0,255,198,0.55)";ctx.textAlign="left";setLS(1);ctx.fillText("PENDULUM WAVE // 18 LENGTHS, ONE CYCLE",40,1876);setLS(0);ctx.restore();}
function nameCard(t){ctx.save();ctx.font="112px 'Bebas Neue'";ctx.fillStyle=WHITE;ctx.textAlign="center";setLS(12);ctx.fillText(t,PIV+6,200);setLS(0);ctx.restore();}
function payoff(){ctx.save();ctx.font="94px 'Bebas Neue'";ctx.fillStyle=WHITE;ctx.textAlign="center";ctx.shadowColor="rgb(138,43,226)";ctx.shadowBlur=18;setLS(9);ctx.fillText("IN SYNC THE WHOLE TIME",PIV+5,200);setLS(0);ctx.restore();}
function frame(now){
  if(startT===null)startT=now;
  let t=paused?pauseAt:(now-startT)/1000;
  if(t>=TOTAL){startT=now;t=0;}
  const st=Math.max(0,t-INTRO);
  // fading trails
  tbx.fillStyle="rgba(0,0,0,0.10)";tbx.fillRect(0,0,1080,1920);
  for(let i=0;i<NB;i++){const y=TOP+i*GAP;const x=PIV+AMP*Math.cos(omega(i)*st);const c=colOf(i);
    tbx.fillStyle=`rgba(${c[0]|0},${c[1]|0},${c[2]|0},0.5)`;tbx.beginPath();tbx.arc(x,y,5,0,Math.PI*2);tbx.fill();}
  ctx.fillStyle=BLACK;ctx.fillRect(0,0,1080,1920);ctx.drawImage(tb,0,0);wm();credit();
  // live bobs
  for(let i=0;i<NB;i++){const y=TOP+i*GAP;const x=PIV+AMP*Math.cos(omega(i)*st);const c=colOf(i);
    ctx.strokeStyle=`rgba(${c[0]|0},${c[1]|0},${c[2]|0},0.20)`;ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(PIV,y);ctx.lineTo(x,y);ctx.stroke();
    ctx.fillStyle=`rgb(${c[0]|0},${c[1]|0},${c[2]|0})`;ctx.beginPath();ctx.arc(x,y,13,0,Math.PI*2);ctx.fill();}
  if(t<INTRO+2.4)nameCard("PENDULUM WAVE"); else if(t>TOTAL-3.5)payoff();
  requestAnimationFrame(frame);
}
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();if(!paused){paused=true;pauseAt=(performance.now()-startT)/1000;}else{paused=false;startT=performance.now()-pauseAt*1000;}}if(e.key==='r'||e.key==='R'){startT=performance.now();paused=false;}});
function boot(){requestAnimationFrame(frame);}
if(document.fonts&&document.fonts.ready)Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,1500))]).then(boot);else boot();
</script>
</body>
</html>

name = "stoopid-credits"
main = "src/index.js"
compatibility_date = "2026-07-01"
workers_dev = true

# Daily copy of the Beans feed (the feed itself updates nightly around 21:00 Central).
[triggers]
crons = ["17 6 * * *"]

[vars]
# Pages allowed to submit forms and use the admin. Add your Wix domain if you embed with a custom origin.
ALLOWED_ORIGINS = "https://devinrasche-hub.github.io,https://www.stoopidtv.com,https://stoopidtv.com"

[[d1_databases]]
binding = "DB"
database_name = "stoopid_credits"
database_id = "00000000-0000-0000-0000-000000000000"   # filled in by .github/workflows/deploy-credits-api.yml
migrations_dir = "migrations"

# Secrets (never in this file): ADMIN_TOKEN (required, 32+ random chars), IP_SALT (recommended).

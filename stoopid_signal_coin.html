const CX=540, CY=880, TARGET=430, S=1000;
const SCALE = TARGET / DATA.maxr;
const HERO_N = 22;        // chains that also show their nested-circle mechanism
const HERO_TERMS = 16;    // circles drawn per hero chain

// ---- precompute each chain's screen-space polyline + split terms for heroes ----
const chains = DATA.chains.map((coeffs, ci)=>{
  const line = new Float32Array(S*2);
  for(let j=0;j<S;j++){
    const A = 2*Math.PI*j/S;
    let x=0,y=0;
    for(const c of coeffs){ const ang=c.f*A + c.p; x+=c.a*Math.cos(ang); y+=c.a*Math.sin(ang); }
    line[j*2]   = CX + x*SCALE;
    line[j*2+1] = CY + y*SCALE;
  }
  // hero mechanism data
  let dcx=0,dcy=0; const terms=[];
  for(const c of coeffs){
    if(c.f===0){ dcx+=c.a*Math.cos(c.p); dcy+=c.a*Math.sin(c.p); }
    else terms.push(c);
  }
  terms.sort((a,b)=>b.a-a.a);
  return { line, dc:[dcx,dcy], terms:terms.slice(0,HERO_TERMS), hero: ci<HERO_N };
});

  ctx.font="24px 'Share Tech Mono', monospace";
  ctx.fillStyle="rgba(0,255,198,0.55)"; ctx.textAlign="left";
  setLS(1); ctx.fillText("FOURIER EPICYCLES // STOOPID COIN", 40, 1876); setLS(0);
  ctx.restore();
}
function payoff(){
  ctx.save();
  ctx.font="96px 'Bebas Neue', sans-serif";
  ctx.fillStyle=WHITE; ctx.textAlign="center";
  ctx.shadowColor=TEAL; ctx.shadowBlur=18;
  setLS(10); ctx.fillText("REALITY IS USER GENERATED", CX+5, 1560); setLS(0);
  ctx.restore();
}

// The traced coin lives on a persistent offscreen buffer. Each frame we only
// stroke the NEWLY-revealed segments onto it (constant cost), instead of
// re-stroking the whole growing path every frame (which stuttered near the end).
const buf=document.createElement('canvas'); buf.width=1080; buf.height=1920;
const bctx=buf.getContext('2d'); bctx.lineJoin="round"; bctx.lineCap="round";
let drawnUpTo=0;
function resetBuf(){ bctx.clearRect(0,0,1080,1920); drawnUpTo=0; }
function extendBuf(reveal){
  if(reveal<=drawnUpTo) return;
  const from=drawnUpTo;                     // start one point back so segments connect
  bctx.beginPath();
  for(const ch of chains){
    const L=ch.line;
    bctx.moveTo(L[from*2], L[from*2+1]);
    for(let k=from+1;k<=reveal;k++) bctx.lineTo(L[k*2], L[k*2+1]);
  }
  bctx.strokeStyle="rgba(0,255,198,0.12)"; bctx.lineWidth=8; bctx.stroke();   // glow
  bctx.strokeStyle="rgba(0,255,198,0.95)"; bctx.lineWidth=2.6; bctx.stroke(); // crisp
  drawnUpTo=reveal;
}

// nested epicycle circles + radius arms for hero chains at angular time A
function drawMechanism(A){
  ctx.save();
  for(const ch of chains){
    if(!ch.hero) continue;
    let x=CX + ch.dc[0]*SCALE, y=CY + ch.dc[1]*SCALE;
    ctx.strokeStyle="rgba(0,255,198,0.22)"; ctx.lineWidth=1;
    for(const c of ch.terms){
      const r=c.a*SCALE;
      if(r>2){ ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.stroke(); }
      const ang=c.f*A + c.p, nx=x+r*Math.cos(ang), ny=y+r*Math.sin(ang);
      ctx.strokeStyle="rgba(255,255,255,0.30)"; ctx.lineWidth=1.4;
      ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(nx,ny); ctx.stroke();
      ctx.strokeStyle="rgba(0,255,198,0.22)"; ctx.lineWidth=1;
      x=nx; y=ny;
    }
  }
  ctx.restore();
}

// bright red pen dots at each chain's current tip
function drawPens(reveal){
  ctx.save();
  ctx.fillStyle=RED; ctx.shadowColor=RED; ctx.shadowBlur=10;
  ctx.beginPath();
  for(const ch of chains){
    const px=ch.line[reveal*2], py=ch.line[reveal*2+1];
    const r = ch.hero ? 5 : 2.4;
    ctx.moveTo(px+r, py); ctx.arc(px, py, r, 0, Math.PI*2);
  }
  ctx.fill();
  ctx.restore();
}

function frame(now){
  if(startT===null) startT=now;
  let t = paused ? pauseAt : (now-startT)/1000;
  if(t>=TOTAL){ startT=now; t=0; }

  ctx.fillStyle=BLACK; ctx.fillRect(0,0,1080,1920);
  watermark(); credit();

  if(t < INTRO){
    if(drawnUpTo>0) resetBuf();               // fresh buffer at the start of each loop
    kickerTop("FOURIER SERIES");
    ctx.save(); ctx.fillStyle=RED; ctx.shadowColor=RED; ctx.shadowBlur=14;
    ctx.beginPath(); ctx.arc(CX,CY,5,0,Math.PI*2); ctx.fill(); ctx.restore();
  } else if(t < INTRO+BUILD){
    const p=(t-INTRO)/BUILD;                  // linear → constant angular velocity
    const A=p*2*Math.PI;
    const reveal=Math.min(S-1, Math.floor(p*S));
    extendBuf(reveal);
    ctx.drawImage(buf,0,0);
    kickerTop("FOURIER SERIES // 167 CIRCLES");
    drawMechanism(A);
    drawPens(reveal);
  } else {
    extendBuf(S-1);                           // ensure full clean coin, then hold
    ctx.drawImage(buf,0,0);
    payoff();
  }
  requestAnimationFrame(frame);
}

addEventListener('keydown', e=>{
  if(e.code==='Space'){ e.preventDefault();
    if(!paused){ paused=true; pauseAt=(performance.now()-startT)/1000; }
    else { paused=false; startT=performance.now()-pauseAt*1000; } }
  if(e.key==='r'||e.key==='R'){ startT=performance.now(); paused=false; }
});

function boot(){ requestAnimationFrame(frame); }
if(document.fonts && document.fonts.ready)
  Promise.race([document.fonts.ready, new Promise(r=>setTimeout(r,1500))]).then(boot);
else boot();
</script>
</body>
</html>

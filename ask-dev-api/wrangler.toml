name = "ask-dev"
main = "src/index.js"
compatibility_date = "2026-07-01"
workers_dev = true

# The Worker also serves the page itself (ask-dev/index.html) at its own address.
# A custom domain (e.g. ask.stoopidtv.com) only works if that zone is in this same Cloudflare account;
# stoopidtv.com currently isn't (deploy error 10083), so there's no `routes` entry here.
[assets]
directory = "../ask-dev"

[vars]
# Only pages on these origins may submit. Comma-separated.
ALLOWED_ORIGINS = "https://ask.stoopidtv.com,https://devinrasche-hub.github.io"

[[d1_databases]]
binding = "DB"
database_name = "ask_dev_requests"
# Filled in by .github/workflows/deploy-ask-dev.yml at deploy time.
database_id = "00000000-0000-0000-0000-000000000000"

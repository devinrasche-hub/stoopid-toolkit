<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STOOPID SIGNAL — Ulam Spiral</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Share+Tech+Mono&display=swap');
  html,body{margin:0;height:100%;background:#000;overflow:hidden;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;}
  canvas{display:block;height:100vh;width:auto;max-width:100vw;background:#000;}
  #warm{position:absolute;left:-9999px;top:-9999px;}
  #warm .b{font-family:'Bebas Neue';} #warm .m{font-family:'Share Tech Mono';}
</style>
</head>
<body>
<style>.vault-return{position:fixed;left:56px;bottom:0;z-index:999;font-family:'Courier New',monospace;font-size:10px;letter-spacing:2px;color:#00FFC6;background:#000;border:1px solid #00FFC6;border-bottom:none;padding:5px 13px;text-decoration:none;opacity:.55;transition:opacity .15s}.vault-return:hover{opacity:1;background:#00FFC6;color:#000}@media(max-width:700px){.vault-return{left:14px}}</style>
<a class="vault-return" href="index.html">&#9666; THE VAULT</a>
<div id="wrap"><canvas id="c" width="1080" height="1920"></canvas></div>
<div id="warm"><span class="b">BEBAS</span><span class="m">MONO</span></div>
<script>
const BLACK='#000000', WHITE='#FFFFFF', TEAL='#00FFC6';
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const CX=540, CY=940, SP=9, NMAX=10201;           // 101x101 spiral

// square-spiral integer positions (walk: run lengths 1,1,2,2,3,3,...)
const gx=new Int16Array(NMAX+1), gy=new Int16Array(NMAX+1);
{ let x=0,y=0,n=1; gx[1]=0; gy[1]=0;
  const dirs=[[1,0],[0,-1],[-1,0],[0,1]]; let di=0, run=1;
  while(n<NMAX){ for(let step=0;step<2;step++){ const [dx,dy]=dirs[di];
      for(let k=0;k<run && n<NMAX;k++){ x+=dx; y+=dy; n++; gx[n]=x; gy[n]=y; }
      di=(di+1)&3; } run++; }
}
// sieve of Eratosthenes
const isP=new Uint8Array(NMAX+1); isP.fill(1); isP[0]=isP[1]=0;
for(let i=2;i*i<=NMAX;i++) if(isP[i]) for(let j=i*i;j<=NMAX;j+=i) isP[j]=0;
let primeTotal=0; for(let i=2;i<=NMAX;i++) if(isP[i]) primeTotal++;

// persistent buffer: draw each revealed integer once
const buf=document.createElement('canvas'); buf.width=1080; buf.height=1920;
const bctx=buf.getContext('2d');
let drawn=1;
function resetBuf(){ bctx.clearRect(0,0,1080,1920); drawn=1; }
function extendBuf(upto){
  // composites: dim gray specks (the "noise")
  bctx.fillStyle="rgba(120,120,120,0.32)"; bctx.beginPath();
  for(let n=drawn+1;n<=upto;n++) if(!isP[n]){ const x=CX+gx[n]*SP, y=CY+gy[n]*SP; bctx.moveTo(x+1.3,y); bctx.arc(x,y,1.3,0,Math.PI*2); }
  bctx.fill();
  // primes: bright teal
  bctx.fillStyle=TEAL; bctx.beginPath();
  for(let n=drawn+1;n<=upto;n++) if(isP[n]){ const x=CX+gx[n]*SP, y=CY+gy[n]*SP; bctx.moveTo(x+3,y); bctx.arc(x,y,3,0,Math.PI*2); }
  bctx.fill();
  drawn=upto;
}
function countPrimes(upto){ let c=0; for(let n=2;n<=upto;n++) if(isP[n]) c++; return c; }

const INTRO=0.8, BUILD=14.0, HOLD=4.0, TOTAL=INTRO+BUILD+HOLD;
let startT=null, paused=false, pauseAt=0;
function setLS(px){ if('letterSpacing' in ctx) ctx.letterSpacing=px+'px'; }
function watermark(){ ctx.save(); ctx.font="30px 'Share Tech Mono', monospace";
  ctx.fillStyle="rgba(255,255,255,0.40)"; ctx.textAlign="center"; setLS(2);
  ctx.fillText("@stoopidshow", CX, 70); setLS(0); ctx.restore(); }
function readout(upto){ ctx.save(); ctx.font="30px 'Share Tech Mono', monospace";
  ctx.fillStyle="rgba(0,255,198,0.68)"; ctx.textAlign="center"; setLS(3);
  ctx.fillText(`n = ${upto}   ·   primes = ${countPrimes(upto)}`, CX, 122); setLS(0); ctx.restore(); }
function credit(){ ctx.save(); ctx.font="24px 'Share Tech Mono', monospace";
  ctx.fillStyle="rgba(0,255,198,0.55)"; ctx.textAlign="left"; setLS(1);
  ctx.fillText("ULAM SPIRAL // TEAL = PRIME", 40, 1876); setLS(0); ctx.restore(); }
function nameCard(txt){ ctx.save(); ctx.font="116px 'Bebas Neue', sans-serif";
  ctx.fillStyle=WHITE; ctx.textAlign="center"; setLS(13);
  ctx.fillText(txt, CX+7, 210); setLS(0); ctx.restore(); }
function payoff(){ ctx.save(); ctx.font="102px 'Bebas Neue', sans-serif";
  ctx.fillStyle=WHITE; ctx.textAlign="center"; ctx.shadowColor=TEAL; ctx.shadowBlur=18;
  setLS(10); ctx.fillText("ORDER HIDING IN THE NOISE", CX+5, 1720); setLS(0); ctx.restore(); }

function frame(now){
  if(startT===null) startT=now;
  let t = paused ? pauseAt : (now-startT)/1000;
  if(t>=TOTAL){ startT=now; t=0; }

  ctx.fillStyle=BLACK; ctx.fillRect(0,0,1080,1920);
  watermark(); credit();

  if(t<INTRO){ if(drawn>1) resetBuf(); nameCard("ULAM SPIRAL");
    ctx.fillStyle=TEAL; ctx.beginPath(); ctx.arc(CX,CY,3,0,Math.PI*2); ctx.fill();
    return requestAnimationFrame(frame); }

  const p=Math.min(1,(t-INTRO)/BUILD);
  const upto=Math.max(2, Math.floor(p*NMAX));
  extendBuf(upto);
  ctx.drawImage(buf,0,0);
  readout(upto);

  if(t<INTRO+2.4) nameCard("ULAM SPIRAL");
  else if(t>=INTRO+BUILD) payoff();

  requestAnimationFrame(frame);
}
addEventListener('keydown', e=>{
  if(e.code==='Space'){ e.preventDefault();
    if(!paused){ paused=true; pauseAt=(performance.now()-startT)/1000; }
    else { paused=false; startT=performance.now()-pauseAt*1000; } }
  if(e.key==='r'||e.key==='R'){ startT=performance.now(); paused=false; }
});
function boot(){ requestAnimationFrame(frame); }
if(document.fonts && document.fonts.ready)
  Promise.race([document.fonts.ready, new Promise(r=>setTimeout(r,1500))]).then(boot);
else boot();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STOOPID SIGNAL — Mandelbrot</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Share+Tech+Mono&display=swap');
  html,body{margin:0;height:100%;background:#000;overflow:hidden;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;}
  canvas{display:block;height:100vh;width:auto;max-width:100vw;background:#000;}
  #warm{position:absolute;left:-9999px;top:-9999px;}#warm .b{font-family:'Bebas Neue';}#warm .m{font-family:'Share Tech Mono';}
</style>
</head>
<body>
<style>.vault-return{position:fixed;left:56px;bottom:0;z-index:999;font-family:'Courier New',monospace;font-size:10px;letter-spacing:2px;color:#00FFC6;background:#000;border:1px solid #00FFC6;border-bottom:none;padding:5px 13px;text-decoration:none;opacity:.55;transition:opacity .15s}.vault-return:hover{opacity:1;background:#00FFC6;color:#000}@media(max-width:700px){.vault-return{left:14px}}</style>
<a class="vault-return" href="index.html">&#9666; THE VAULT</a>
<div id="wrap"><canvas id="c" width="1080" height="1920"></canvas></div>
<div id="warm"><span class="b">B</span><span class="m">M</span></div>
<script>
const BLACK='#000000',WHITE='#FFFFFF',TEAL='#00FFC6';
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
ctx.imageSmoothingEnabled=true;
// low-res compute buffer (9:16), scaled up soft for the glow look
const BW=270, BH=480;
const off=document.createElement('canvas');off.width=BW;off.height=BH;
const octx=off.getContext('2d'); const img=octx.createImageData(BW,BH);
// famous deep-zoom point (seahorse valley)
const TX=-0.743643887037151, TY=0.13182590420533;
// palette ramp black->teal->purple->orange->white
const RAMP=[[0,0,0],[0,255,198],[138,43,226],[204,85,0],[255,255,255]];
function ramp(t){ t=Math.max(0,Math.min(0.9999,t))*(RAMP.length-1); const a=Math.floor(t),f=t-a;
  const c1=RAMP[a],c2=RAMP[a+1]; return [c1[0]+(c2[0]-c1[0])*f,c1[1]+(c2[1]-c1[1])*f,c1[2]+(c2[2]-c1[2])*f]; }

const INTRO=0.7, ZOOM=22, RESET=1.8, TOTAL=INTRO+ZOOM+RESET;
let startT=null,paused=false,pauseAt=0;

function render(span,iterMax){
  const d=img.data; const asp=BH/BW;
  for(let py=0;py<BH;py++){ const y0=TY+(py/BH-0.5)*span*asp;
    for(let px=0;px<BW;px++){ const x0=TX+(px/BW-0.5)*span;
      let x=0,y=0,i=0;
      while(x*x+y*y<=4 && i<iterMax){ const xt=x*x-y*y+x0; y=2*x*y+y0; x=xt; i++; }
      const o=(py*BW+px)*4;
      if(i>=iterMax){ d[o]=0;d[o+1]=0;d[o+2]=0;d[o+3]=255; }
      else { const sm=(i - Math.log2(Math.log2(x*x+y*y+1e-9)+1e-9)); // smooth escape
        const c=ramp((sm*0.028)%1); d[o]=c[0];d[o+1]=c[1];d[o+2]=c[2];d[o+3]=255; }
    }
  }
  octx.putImageData(img,0,0);
}
function setLS(px){if('letterSpacing' in ctx)ctx.letterSpacing=px+'px';}
function wm(){ctx.save();ctx.font="30px 'Share Tech Mono'";ctx.fillStyle="rgba(255,255,255,0.55)";ctx.textAlign="center";setLS(2);ctx.fillText("@stoopidshow",540,70);setLS(0);ctx.restore();}
function readout(zoom){ctx.save();ctx.font="28px 'Share Tech Mono'";ctx.fillStyle="rgba(0,255,198,0.80)";ctx.textAlign="center";setLS(3);ctx.fillText(`ZOOM ×${zoom.toExponential(1)}`,540,120);setLS(0);ctx.restore();}
function credit(){ctx.save();ctx.font="24px 'Share Tech Mono'";ctx.fillStyle="rgba(0,255,198,0.75)";ctx.textAlign="left";setLS(1);ctx.fillText("MANDELBROT // z = z² + c",40,1876);setLS(0);ctx.restore();}
function nameCard(t){ctx.save();ctx.font="118px 'Bebas Neue'";ctx.fillStyle=WHITE;ctx.textAlign="center";ctx.shadowColor="#000";ctx.shadowBlur=16;setLS(14);ctx.fillText(t,547,222);setLS(0);ctx.restore();}
function payoff(){ctx.save();ctx.font="102px 'Bebas Neue'";ctx.fillStyle=WHITE;ctx.textAlign="center";ctx.shadowColor="#000";ctx.shadowBlur=20;setLS(9);ctx.fillText("ONE EQUATION. NO BOTTOM.",545,1000);setLS(0);ctx.restore();}
function frame(now){
  if(startT===null)startT=now;
  let t=paused?pauseAt:(now-startT)/1000;
  if(t>=TOTAL){startT=now;t=0;}
  const zt=Math.max(0,Math.min(ZOOM,t-INTRO))/ZOOM;
  const zoom=Math.pow(10, zt*13);                 // exponential zoom to ×10^13
  const span=3.2/zoom;
  const iterMax=Math.floor(140+zt*900);
  render(span,iterMax);
  ctx.fillStyle=BLACK;ctx.fillRect(0,0,1080,1920);
  ctx.drawImage(off,0,0,1080,1920);
  wm();credit();readout(zoom);
  if(t<INTRO+2.4)nameCard("MANDELBROT"); else if(t>=INTRO+ZOOM)payoff();
  requestAnimationFrame(frame);
}
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();if(!paused){paused=true;pauseAt=(performance.now()-startT)/1000;}else{paused=false;startT=performance.now()-pauseAt*1000;}}if(e.key==='r'||e.key==='R'){startT=performance.now();paused=false;}});
function boot(){requestAnimationFrame(frame);}
if(document.fonts&&document.fonts.ready)Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,1500))]).then(boot);else boot();
</script>
</body>
</html>
